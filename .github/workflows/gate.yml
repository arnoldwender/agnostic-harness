# The Agnostic Harness runs its own executable falsifier on every push. The
# Sentinel's rule is "refuse the cheap rescue"; this workflow is the check that
# the repo does not ship one.
#
# Nothing here interpolates untrusted input into a shell. The base ref reaches
# the script through the environment and is read back as a quoted "$BASE",
# never as `${{ ... }}` inside a `run:` body: git permits characters in a ref
# that a shell would read as syntax, and a fork PR controls its own ref names.
name: fail-open gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push on the same branch cancels the previous run; only the last one
  # decides anything.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fail-open:
    name: fail-open gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads a diff, so it needs history. Under the default
          # shallow clone the base ref does not exist and the gate exits 2 -
          # correctly, and uselessly.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Self-check (the repo keeps its own promises)
        run: python3 scripts/check.py

      - name: Fail-open gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Both values are commit SHAs, and both arrive through the environment.
          # `github.event.before` is all zeros for the first push of a branch and
          # there is no base sha outside a pull request, so fall back rather than
          # let the gate exit 2 on a technicality.
          if ! git rev-parse --verify -q "${BASE}^{commit}" > /dev/null; then
            BASE="HEAD~1"
          fi
          python3 gate/fail_open.py --base "$BASE" --sarif fail-open.sarif

      - name: Citation gate (every quotation traces to sources/)
        # Deliberately NOT behind `if: pull_request`. The fail-open gate reads a
        # diff and has nothing to say on a push with no diff; this one reads the
        # whole tree, so it means the same thing on every event. PyYAML is not
        # installed on purpose, and there is no fallback to keep honest: the gate
        # parses sources/*.yml with a parser it ships itself, in every
        # environment. Preferring an installed library was the one arrangement
        # this repo's own axis forbids — a verdict that depends on what happens
        # to be on the machine is a gate that fails open somewhere.
        run: python3 gate/citations.py --sarif citations.sarif

      - name: Citation gate, online (manual runs only)
        # Link rot is worth knowing about and is never a reason to block a commit
        # that did not touch the link.
        if: github.event_name == 'workflow_dispatch'
        run: python3 gate/citations.py --online

      - name: Mutation check for the citation gate (do its tests defend it?)
        # Separate from the repo's own mutation runner above: two gates, two
        # runners, so a stale anchor in one cannot quietly disable the other.
        run: python3 tests/mutation_check_citations.py

      - name: Mutation check (do the tests defend the gate?)
        run: python3 tests/mutation_check.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-open-sarif
          path: fail-open.sarif
          if-no-files-found: ignore

      - name: Upload citation SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citations-sarif
          path: citations.sarif
          if-no-files-found: ignore
