#
# This is Richard Mott Gummere's Loeb wording, verbatim, from Epistle 76.3 -
# where Seneca is himself quoting a proverb. Verified 2026-09-10 against the
# Wikisource setting of the Gummere translation, which prints:
#
#   "You should keep learning as long as you are ignorant, - even to the end of
#    your life, if there is anything in the proverb. And the proverb suits the
#    present case as well as any: As long as you live, keep learning how to live."
#
# Wikisource can host it because the Loeb volume is pre-1930 and therefore free
# in the United States. That says nothing about Germany.
