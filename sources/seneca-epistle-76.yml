# RESUELTO 2026-09-10 imprimiendo el latin, porque no habia salida barata.
#
# La linea circulaba como "As long as you live, keep learning how to live", que
# es la redaccion de Richard M. Gummere en la Loeb Classical Library. Gummere
# murio en 1969: vida + 70 = 2040 en la UE. Arnold publica desde Alemania, asi
# que ese es el plazo que obliga, aunque el texto sea PD en EE.UU. por fecha de
# publicacion.
#
# POR QUE NO SE CAMBIO DE TRADUCTOR, que fue la salida en el caso de Sun Tzu:
# la unica traduccion inglesa completa de las Epistulae Morales libre en ambas
# jurisdicciones es la de Thomas Lodge (1614, murio 1625) — y su ingles jacobino
# no funciona como maxima de apertura de una sesion de trabajo. Aubrey Stewart
# (1844-1918) tradujo los Dialogos, no las Epistolas.
#
# Asi que se imprime el LATIN, que es dominio publico sin discusion posible, y el
# ingles va marcado `editor's gloss`: palabras del editor, no una cita puesta en
# boca de Gummere. Mismo patron que el pool japones de bushido-harness.
#
# El latin se verifico en thelatinlibrary.com (Liber IX), no se cito de memoria.
work: "Epistulae Morales ad Lucilium, Epistle 76, section 3"
author: "Lucius Annaeus Seneca"
author_born: -4
author_died: 65
year: 65
edition: "Latin text as printed at thelatinlibrary.com, Epistulae Morales Liber IX. The English on the line is an editor's gloss, not a published translation."
pd_status_us: "Escrito en el siglo I. El texto latino es de dominio publico."
pd_status_eu: "Autor muerto en el ano 65. El texto latino es de dominio publico. No se usa ninguna traduccion inglesa moderna: la de Gummere (m. 1969) estaria protegida hasta 2040 y por eso se descarto."
source_url: "https://www.thelatinlibrary.com/sen/seneca.ep9.shtml"
provenance: verified
quotes:
  - "Tamdiu discendum est quamdiu nescias; si proverbio credimus, quamdiu vivas."
