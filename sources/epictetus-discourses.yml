# UNVERIFIED ENGLISH, both lines. The loci are real; the wordings are modern
# condensations that match neither of the two public-domain translations.
#
# Measured 2026-09-10 against the full text of Elizabeth Carter's translation
# (1768 printing of the 1758 edition, Internet Archive) and George Long's
# (1887 printing), searched with whitespace normalisation so an OCR line break
# cannot produce a false miss:
#
#   Discourses I.15.7 - Carter: "No great thing is brought to perfection
#     suddenly, when not so much as a bunch of grapes or a fig is."
#                      - Long:   "Nothing great, said Epictetus, is produced
#     suddenly, since not even the grape or the fig is."
#     The pool says "created". Neither translator wrote that.
#
#   Discourses II.17.1 - Carter: "it is impossible for any one to begin to learn
#     what he hath a conceit that he already knows."
#     The pool drops 'begin to' and modernises the rest.
#
# Both are kept and marked rather than swapped, because swapping them silently
# would change what the harness emits without anyone being told.
work: "Discourses, I.15.7 and II.17.1"
author: "Epictetus"
