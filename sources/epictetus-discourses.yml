provenance_note: "Loci confirmed: Discourses I.15.7 and II.17.1. What could NOT be confirmed is the English. Neither line appears in Carter (1758) or Long (1877), the two public-domain translations; both are modernised condensations circulating without a translator's name. They are paraphrases of Epictetus, not quotations from an edition."
quotes:
